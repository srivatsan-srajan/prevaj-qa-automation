name: Prevaj QA Automation

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    name: API Automation Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run API tests
        run: >
          mvn --batch-mode clean test
          -Dapi.key="${{ secrets.REQRES_API_KEY }}"
          -Dcucumber.filter.tags="@api"
      
      - name: Upload API Surefire reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-surefire-reports
          path: target/surefire-reports/
          retention-days: 14
      
      - name: Rename API Cucumber report
        if: always()
        run: cp target/cucumber-report/cucumber.html target/cucumber-report/api-cucumber-report.html

      - name: Upload API Cucumber HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-cucumber-report
          path: target/cucumber-report/api-cucumber-report.html
          archive: false
          if-no-files-found: error
          retention-days: 14

  ui-tests:
    name: UI Automation Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run UI tests
        run: >
          mvn --batch-mode clean test
          -Dbrowser=chrome
          -Dheadless=true
          -Dcucumber.filter.tags="@ui"
          -Dparallel.enabled=true
          -Dparallel.count=3

      - name: Upload UI Surefire reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-surefire-reports
          path: target/surefire-reports/
          retention-days: 14
      
      - name: Rename UI Cucumber report
        if: always()
        run: cp target/cucumber-report/cucumber.html target/cucumber-report/ui-cucumber-report.html

      - name: Upload UI Cucumber HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-cucumber-report
          path: target/cucumber-report/ui-cucumber-report.html
          archive: false
          if-no-files-found: error
          retention-days: 14
