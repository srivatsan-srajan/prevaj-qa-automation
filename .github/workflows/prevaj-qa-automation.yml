
name: Prevaj QA Automation

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  api-tests:
    name: API Automation Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run API tests
        run: >
          mvn --batch-mode clean test
          -Dapi.key="${{ secrets.REQRES_API_KEY }}"
          -Dcucumber.filter.tags="@api"

      - name: Upload API test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: |
            target/surefire-reports/
            target/cucumber-report/cucumber.html
          if-no-files-found: error
          retention-days: 14

  ui-tests:
    name: UI Automation Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run UI tests
        run: >
          mvn --batch-mode clean test
          -Dbrowser=firefox
          -Dheadless=true
          -Dcucumber.filter.tags="@ui"
          -Dparallel.enabled=true
          -Dparallel.count=3

      - name: Upload UI test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-reports
          path: |
            target/surefire-reports/
            target/cucumber-report/cucumber.html
          if-no-files-found: error
          retention-days: 14
